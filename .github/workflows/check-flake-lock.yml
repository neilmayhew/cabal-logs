name: Check flake.lock

on:
  push:
    branches:
    - main
    paths:
    - flake.lock
  pull_request:
    paths:
    - flake.lock
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:

    - name: Install nix
      uses: cachix/install-nix-action@v31

    - name: Checkout
      uses: actions/checkout@v6

    - name: Check lock entries
      uses: workflow/nix-shell-action@fix-legacy-nix-run
      with:
        packages: jq,nix-prefetch-git
        script: |
          jq -r '.nodes[].locked | select(.type == "github") | "\(.owner)/\(.repo) \(.rev) \(.narHash)"' flake.lock |
          while read -r REPO REV HASH
          do
            echo "Checking $REPO ..."
            nix-prefetch-git --quiet --no-add-path \
              "https://github.com/$REPO" "$REV" "$(nix hash convert --to nix32 "$HASH")" >/dev/null
          done
