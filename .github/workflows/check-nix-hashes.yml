name: Check nix hashes

on:
  push:
    branches:
    - main
    paths:
    - flake.lock
  pull_request:
    paths:
    - flake.lock
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v6

    - name: Install nix
      uses: cachix/install-nix-action@v31

    - name: Check nix hashes
      run: scripts/check-nix-hashes.hs -v
